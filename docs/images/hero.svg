<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc">
  <title id="title">抖音清道夫：用时正常，退出后台后自动收尾</title>
  <desc id="desc">流程示意：通过入口打开抖音，正常使用，退出后台后清理并复查残留。一次实机验收中残留进程为零。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101927"/><stop offset="1" stop-color="#0b101a"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#47ebda"/><stop offset="1" stop-color="#b2fff2"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".025"/></pattern>
  </defs>
  <rect width="1440" height="640" rx="28" fill="url(#bg)"/>
  <rect width="1440" height="640" rx="28" fill="url(#grid)"/>
  <path d="M0 150V28Q0 0 28 0H450" fill="none" stroke="#47ebda" stroke-width="3" opacity=".65"/>
  <path d="M1040 640H1412Q1440 640 1440 612V460" fill="none" stroke="#ff6585" stroke-width="3" opacity=".65"/>
  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
    <rect x="72" y="58" width="364" height="38" rx="19" fill="#47ebda" fill-opacity=".1" stroke="#47ebda" stroke-opacity=".24"/>
    <circle cx="92" cy="77" r="5" fill="#47ebda"/>
    <text x="111" y="84" fill="#a7ede4" font-size="18" letter-spacing="1.5">WINDOWS · OPEN SOURCE · MIT</text>
    <text x="68" y="216" fill="#f7faff" font-size="96" font-weight="700" letter-spacing="2">抖音清道夫</text>
    <text x="74" y="271" fill="#9fabbf" font-size="26" letter-spacing="4">DOUYIN DESKTOP CLEANUP</text>
    <text x="72" y="341" fill="#ecf2fb" font-size="34">刷的时候正常用。</text>
    <text x="72" y="391" fill="url(#accent)" font-size="34" font-weight="600">退出后台，自动收尾。</text>
    <g transform="translate(1094 236)">
      <circle r="136" fill="#47ebda" fill-opacity=".035" stroke="#47ebda" stroke-opacity=".12"/>
      <circle r="110" fill="none" stroke="#47ebda" stroke-opacity=".3" stroke-width="2" stroke-dasharray="4 10"/>
      <text text-anchor="middle" y="37" fill="#47ebda" font-size="140" font-weight="650">0</text>
      <text text-anchor="middle" y="81" fill="#b9c8dc" font-size="24">残留进程</text>
    </g>
    <text x="1094" y="408" text-anchor="middle" fill="#8493aa" font-size="18">一次正常播放与后台退出实机验收</text>
    <g transform="translate(72 470)">
      <rect width="392" height="110" rx="16" fill="#162331" stroke="#2b3c50"/>
      <rect x="22" y="28" width="44" height="44" rx="12" fill="#47ebda" fill-opacity=".12"/>
      <text x="44" y="57" text-anchor="middle" fill="#47ebda" font-size="22" font-weight="700">01</text>
      <text x="87" y="49" fill="#f0f5ff" font-size="25" font-weight="600">双击入口</text>
      <text x="87" y="80" fill="#95a8bf" font-size="19">Start-Douyin.bat</text>
    </g>
    <g transform="translate(524 470)">
      <rect width="392" height="110" rx="16" fill="#162331" stroke="#2b3c50"/>
      <rect x="22" y="28" width="44" height="44" rx="12" fill="#47ebda" fill-opacity=".12"/>
      <text x="44" y="57" text-anchor="middle" fill="#47ebda" font-size="22" font-weight="700">02</text>
      <text x="87" y="49" fill="#f0f5ff" font-size="25" font-weight="600">正常刷视频</text>
      <text x="87" y="80" fill="#95a8bf" font-size="19">主程序运行时保护组件</text>
    </g>
    <g transform="translate(976 470)">
      <rect width="392" height="110" rx="16" fill="#231c2c" stroke="#473043"/>
      <rect x="22" y="28" width="44" height="44" rx="12" fill="#ff6585" fill-opacity=".12"/>
      <text x="44" y="57" text-anchor="middle" fill="#ff90a6" font-size="22" font-weight="700">03</text>
      <text x="87" y="49" fill="#f0f5ff" font-size="25" font-weight="600">退出后台</text>
      <text x="87" y="80" fill="#b49bb0" font-size="19">隔离 → 清理 → 复查</text>
