name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: PowerShell regression
        shell: powershell
        run: .\tests\Regression.Tests.ps1
      - name: Source privacy review
        shell: powershell
        run: .\tools\Review-Project.ps1
